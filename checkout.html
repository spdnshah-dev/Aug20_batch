<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — ShopLane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css">
<script src="shop.js"></script>
</head>
<body>
<header class="top"><div class="in">
  <a class="logo" href="index.html">Shop<span>Lane</span></a>
  <a class="cartlink" href="cart.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h11.2L21 8H6.2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>Cart <span id="cart-count" class="badge" hidden>0</span></a>
</div></header>
<div class="demo">Demo store — no real orders are placed and no payment is taken. Details you type stay in this browser only.</div>
<div class="steps"><span class="done">✓ Cart</span><span class="on">2 Address &amp; payment</span><span>3 Order placed</span></div>

<main class="wrap" id="app">
  <form class="main" id="form" novalidate>
    <section class="card">
      <h2>1. Delivery address</h2>
      <div class="grid">
        <label>Full name<input name="name" autocomplete="name" required><span class="err"></span></label>
        <label>Mobile number<input name="phone" inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="10-digit number" required><span class="err"></span></label>
        <label>Pincode<input name="pin" inputmode="numeric" autocomplete="postal-code" maxlength="6" placeholder="6 digits" required><span class="err"></span></label>
        <label>City<input name="city" autocomplete="address-level2" required><span class="err"></span></label>
        <label class="full">Address (house no., street, area)<textarea name="addr" rows="2" autocomplete="street-address" required></textarea><span class="err"></span></label>
        <label>State<select name="state" required><option value="">Select state</option></select><span class="err"></span></label>
        <label>Landmark (optional)<input name="landmark"><span class="err"></span></label>
      </div>
    </section>
    <section class="card">
      <h2>2. Payment method</h2>
      <div class="pay">
        <label><input type="radio" name="pay" value="Cash on Delivery" checked><span>Cash on Delivery<small>Pay in cash when the order arrives</small></span></label>
        <label><input type="radio" name="pay" value="UPI on Delivery"><span>UPI on Delivery<small>Scan and pay with any UPI app at your door</small></span></label>
        <label><input type="radio" name="pay" value="No-cost EMI (demo)"><span>No-cost EMI<small>12 months · demo only, no card details are collected</small></span></label>
      </div>
    </section>
  </form>
  <aside class="side"><div class="card sum" id="summary"></div></aside>
</main>

<script>
(function () {
  var L = window.ShopLane;
  var buyNow = new URLSearchParams(location.search).get('buy') === '1';
  var items = buyNow ? L.getBuyNow() : L.getCart();
  var app = document.getElementById('app'), form = document.getElementById('form');
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  if (!items.length) {
    app.innerHTML = '<section class="card main empty"><h1>Nothing to check out</h1><p class="muted">Your cart is empty.</p><a class="btn dark" style="max-width:260px;margin:16px auto 0" href="index.html">Continue shopping</a></section>';
    return;
  }
  if (buyNow) document.querySelector('.steps .done').textContent = '✓ Buy now';

  var states = ['Andhra Pradesh','Arunachal Pradesh','Assam','Bihar','Chhattisgarh','Delhi','Goa','Gujarat','Haryana','Himachal Pradesh','Jammu & Kashmir','Jharkhand','Karnataka','Kerala','Madhya Pradesh','Maharashtra','Manipur','Meghalaya','Mizoram','Nagaland','Odisha','Puducherry','Punjab','Rajasthan','Sikkim','Tamil Nadu','Telangana','Tripura','Uttar Pradesh','Uttarakhand','West Bengal'];
  var sel = form.state; states.forEach(function (s) { var o = document.createElement('option'); o.textContent = s; sel.appendChild(o); });

  // Remember the address between visits (this browser only).
  var saved = L.read('sl_address', null);
  if (saved) Object.keys(saved).forEach(function (k) { if (form[k] && form[k].type !== 'radio') form[k].value = saved[k]; });

  var t = L.totals(items);
  document.getElementById('summary').innerHTML = '<h2>Order summary</h2>' +
    t.items.map(function (i) { return '<div><span>' + esc(i.name) + (i.variant ? '<br><span class="muted">' + esc(i.variant) + '</span>' : '') + (i.qty > 1 ? ' <span class="muted">× ' + i.qty + '</span>' : '') + '</span><span>' + L.inr(i.line) + '</span></div>'; }).join('') +
    '<div style="margin-top:8px"><span>Price (' + t.count + ' item' + (t.count > 1 ? 's' : '') + ')</span><span>' + L.inr(t.mrp) + '</span></div>' +
    '<div><span>Discount</span><span class="tag">− ' + L.inr(t.discount) + '</span></div>' +
    '<div><span>Delivery</span><span class="tag">Free</span></div>' +
    '<div class="tot"><span>Total</span><span>' + L.inr(t.total) + '</span></div>' +
    '<button class="btn primary" type="submit" form="form">PLACE ORDER · ' + L.inr(t.total) + '</button>' +
    (buyNow ? '<a class="btn ghost" href="index.html">Back to product</a>' : '<a class="btn ghost" href="cart.html">Edit cart</a>');

  ['phone', 'pin'].forEach(function (n) { form[n].addEventListener('input', function () { this.value = this.value.replace(/[^0-9]/g, ''); }); });

  var rules = {
    name: function (v) { return v.trim().length >= 2 || 'Enter your full name'; },
    phone: function (v) { return /^[6-9][0-9]{9}$/.test(v) || 'Enter a valid 10-digit mobile number'; },
    pin: function (v) { return /^[1-9][0-9]{5}$/.test(v) || 'Enter a valid 6-digit pincode'; },
    city: function (v) { return v.trim().length >= 2 || 'Enter your city'; },
    addr: function (v) { return v.trim().length >= 8 || 'Enter your full address'; },
    state: function (v) { return !!v || 'Select your state'; }
  };
  function check(n) {
    var ok = rules[n](form[n].value), el = form[n];
    el.classList.toggle('invalid', ok !== true);
    el.parentNode.querySelector('.err').textContent = ok === true ? '' : ok;
    return ok === true;
  }
  Object.keys(rules).forEach(function (n) {
    form[n].addEventListener('blur', function () { check(n); });
    form[n].addEventListener(n === 'state' ? 'change' : 'input', function () { if (form[n].classList.contains('invalid')) check(n); });
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var bad = Object.keys(rules).filter(function (n) { return !check(n); });
    if (bad.length) { form[bad[0]].focus(); return; }
    var addr = {}; ['name', 'phone', 'pin', 'city', 'addr', 'state', 'landmark'].forEach(function (k) { addr[k] = form[k].value.trim(); });
    L.write('sl_address', addr);
    var d = new Date(); d.setDate(d.getDate() + 3);
    L.saveOrder({
      id: 'SL' + Date.now().toString().slice(-8) + Math.floor(Math.random() * 90 + 10),
      placed: new Date().toISOString(),
      deliverBy: d.toISOString(),
      items: t.items, mrp: t.mrp, discount: t.discount, total: t.total, count: t.count,
      address: addr, payment: form.querySelector('input[name=pay]:checked').value
    });
    if (buyNow) L.setBuyNow([]); else L.setCart([]);
    location.href = 'order-success.html';
  });
})();
</script>
</body>
</html>
